name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    # Construit l'image et la publie sur ghcr.io/<compte>/durak à chaque push sur main.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

  deploy:
    # VPS_HOST, VPS_USER et VPS_PORT sont acceptés en variables ou en secrets, au niveau
    # du dépôt ou de l'environnement « production ». Sans VPS_HOST, le déploiement est sauté.
    needs: image
    runs-on: ubuntu-24.04
    concurrency: production
    environment:
      name: production
      url: https://durak.tanguydavid.fr
    steps:
      - name: Mise à jour sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::VPS_HOST, VPS_USER ou VPS_SSH_KEY manquant : déploiement sauté."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          # Tolère les copier-coller abîmés : retours chariot Windows, espaces en fin de ligne.
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | sed 's/[[:space:]]*$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          if ! ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            # Diagnostic sans jamais afficher la clé.
            if grep -q '^ssh-' ~/.ssh/id_deploy; then why="c'est la clé publique (.pub) qui a été collée, il faut la clé privée (fichier sans .pub)"
            elif ! grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/id_deploy; then why="la ligne -----BEGIN OPENSSH PRIVATE KEY----- est absente"
            elif ! grep -q 'END OPENSSH PRIVATE KEY' ~/.ssh/id_deploy; then why="la clé est tronquée : la ligne -----END OPENSSH PRIVATE KEY----- est absente"
            elif [ "$(wc -l < ~/.ssh/id_deploy)" -lt 3 ]; then why="les retours à la ligne ont été perdus au copier-coller"
            else why="contenu illisible ($(wc -l < ~/.ssh/id_deploy) lignes)"; fi
            echo "::error::VPS_SSH_KEY invalide : $why. Recopie-la avec : wl-copy < ~/.ssh/durak_deploy"
            exit 1
          fi
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          if ! ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" \
            'cd ~/durak && docker compose pull && docker compose up -d && docker image prune -f' 2> ssh.err; then
            echo "::error::Échec SSH : $(grep -v '^Warning' ssh.err | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          cat ssh.err
