name: Tests et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  image:
    # Construit l'image et la publie sur ghcr.io/<compte>/durak à chaque push sur main.
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}

  deploy:
    # VPS_HOST, VPS_USER et VPS_PORT sont acceptés en variables ou en secrets, au niveau
    # du dépôt ou de l'environnement « production ». Sans VPS_HOST, le déploiement est sauté.
    needs: image
    runs-on: ubuntu-latest
    concurrency: production
    environment:
      name: production
      url: https://durak.tanguydavid.fr
    steps:
      - name: Mise à jour sur le VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ vars.VPS_HOST || secrets.VPS_HOST }}
          USER: ${{ vars.VPS_USER || secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || secrets.VPS_PORT || '22' }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$SSH_KEY" ]; then
            echo "::warning::VPS_HOST, VPS_USER ou VPS_SSH_KEY manquant : déploiement sauté."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$PORT" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null 2>&1 \
            || { echo "::error::VPS_SSH_KEY n'est pas une clé privée valide (copie tout le fichier, lignes BEGIN/END comprises)."; exit 1; }
          if ! ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 "$USER@$HOST" \
            'cd ~/durak && docker compose pull && docker compose up -d && docker image prune -f' 2> ssh.err; then
            echo "::error::Échec SSH : $(grep -v '^Warning' ssh.err | tail -3 | tr '\n' ' ')"
            exit 1
          fi
          cat ssh.err
