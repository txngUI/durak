# À copier sur le VPS dans ~/durak/docker-compose.yml
services:
  durak:
    image: ghcr.io/txngui/durak:latest
    container_name: durak
    restart: unless-stopped
    # Clés Supabase (comptes et stats) : fichier .env à côté de ce docker-compose.yml, jamais commité.
    env_file:
      - path: .env
        required: false
    # Les salons en cours sont sauvegardés ici à chaque arrêt, puis repris au démarrage.
    volumes:
      - durak-data:/data
    stop_grace_period: 20s
    # Caddy (dans Docker) joint le jeu par le réseau partagé, à l'adresse durak:3000.
    networks:
      - caddy
    # Accès local pour le diagnostic uniquement (curl localhost:3010/health), invisible depuis Internet.
    ports:
      - "127.0.0.1:3010:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  caddy:
    external: true
    # Nom du réseau du conteneur caddy-caddy-1 (voir deploy/README.md, étape 5).
    name: web

volumes:
  durak-data:
